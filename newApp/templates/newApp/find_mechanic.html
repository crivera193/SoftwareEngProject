{% extends "newApp/base.html" %}

{% block content %}
<div class="container py-5">
    <h1 class="fw-bold mb-3">Find a Mechanic Near You</h1>
    <p class="text-muted">
        Allow location access to find nearby mechanic shops.
    </p>

    <button class="btn btn-primary rounded-pill mb-3" onclick="getLocation()">
        📍 Find Nearby Mechanics
    </button>

    <div id="map" style="height: 500px; border-radius: 12px;"></div>

    <a href="{% url 'home' %}" class="btn btn-outline-secondary rounded-pill mt-4">
        Back Home
    </a>
</div>

<!-- Leaflet Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCBCpLZ3PDWm2BHSQBYlFi4agMvVLl46hc&libraries=places"></script>

<script>
let map;
let service;
let infowindow;

function initMap(lat, lon) {
    const userLocation = new google.maps.LatLng(lat, lon);

    map = new google.maps.Map(document.getElementById("map"), {
        center: userLocation,
        zoom: 13,
    });

    // User marker
    new google.maps.Marker({
    position: userLocation,
    map: map,
    title: "You are here",
    icon: {
        url: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
    }
    });

    infowindow = new google.maps.InfoWindow();

    const request = {
        location: userLocation,
        radius: 5000,
        keyword: "car repair"
    };

    service = new google.maps.places.PlacesService(map);
    service.nearbySearch(request, callback);
}

function callback(results, status) {
    if (status === google.maps.places.PlacesServiceStatus.OK) {
        results.forEach(place => createMarker(place));
    }
}

function createMarker(place) {
    const marker = new google.maps.Marker({
        map: map,
        position: place.geometry.location
    });

    marker.addListener("click", function () {
        const request = {
            placeId: place.place_id,
            fields: [
                "name",
                "formatted_phone_number",
                "international_phone_number",
                "formatted_address"
            ]
        };

        service.getDetails(request, function (details, status) {
            console.log(details, status);

            if (status === google.maps.places.PlacesServiceStatus.OK) {
                infowindow.setContent(`
                    <strong>${details.name || "No name available"}</strong><br>
                    📍 ${details.formatted_address || "No address available"}<br>
                    📞 ${details.formatted_phone_number || details.international_phone_number || "No phone available"}
                `);
                infowindow.open(map, marker);
            }
        });
    });
}

function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                initMap(position.coords.latitude, position.coords.longitude);
            },
            function() {
                alert("Location access denied.");
            }
        );
    } else {
        alert("Geolocation not supported.");
    }
}
</script>

{% endblock %}
