{% extends "newApp/base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
  <div class="text-center mt-5">
    <h1 class="display-4">Hello Vaqueros</h1>
    <p class="lead">Welcome to your Bootstrap + Django site.</p>

    {% if user.is_authenticated %}
      <p class="mt-4">You are logged in as <strong>{{ user.username }}</strong>.</p>
      <a href="{% url 'profile' %}" class="btn btn-primary">Go to Profile</a>
    {% else %}
      <div class="mt-4">
        <a href="{% url 'login' %}" class="btn btn-primary me-2">Login</a>
        <a href="{% url 'register' %}" class="btn btn-success">Register</a>
      </div>
    {% endif %}
  </div>
{% endblock %}
